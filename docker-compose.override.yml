# Carregado automaticamente por `docker compose up --build` (uso local):
# builda a imagem do código e expõe o Postgres.
# Na VPS use `docker compose -f docker-compose.yml up -d` para ignorar este arquivo.
services:
  telegram-bot:
    build: .
    pull_policy: never

  whatsapp-bot:
    build: .
    pull_policy: never

  # Mesmo build do telegram-bot (o Docker reaproveita o cache), para subir o coletor sozinho também.
  coletor:
    build: .
    pull_policy: never

  db:
    ports:
      - "5432:5432"
