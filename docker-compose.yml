services:
  # Bot do Telegram. Outro canal (ex.: WhatsApp) entra como outro serviço, com o seu próprio projeto.
  telegram-bot:
    image: ghcr.io/baautitz/assistente-desinformacao-politica:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ConnectionStrings__Postgres: Host=db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  # Bot do WhatsApp (sem API oficial): recebe as mensagens por webhook da Evolution API e responde por ela.
  # Só sobe com `--profile whatsapp`, para quem usa apenas o Telegram não precisar configurar nada.
  whatsapp-bot:
    image: ghcr.io/baautitz/assistente-desinformacao-politica:latest
    profiles: [whatsapp]
    restart: unless-stopped
    working_dir: /app/whatsapp-bot
    entrypoint: ["dotnet", "AssistenteDesinformacao.WhatsAppBot.dll"]
    env_file: .env
    environment:
      ConnectionStrings__Postgres: Host=db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
      EVOLUTION_URL: http://evolution:8080
    depends_on:
      db:
        condition: service_healthy
      evolution:
        condition: service_started

  # Evolution API: mantém a sessão do WhatsApp (QR code) e conversa com o bot por webhook/REST.
  # Versão estável fixada; a 2.4 ainda está em release candidate. Guarda a sessão no schema `evolution_api` do mesmo Postgres.
  # Mensagens NÃO são salvas (todos os DATABASE_SAVE_* abaixo, menos o da instância, ficam em false), como o resto do projeto.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: [whatsapp]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # só na própria máquina: para ler o QR code em http://localhost:8080/manager (na VPS, use túnel SSH)
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://whatsapp-bot:8080/webhook?token=${WHATSAPP_WEBHOOK_TOKEN}
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes:
      - evolution_instancias:/evolution/instances
    depends_on:
      db:
        condition: service_healthy

  # Mesma imagem, outro processo: lê os feeds RSS e grava as Matérias no Postgres.
  coletor:
    image: ghcr.io/baautitz/assistente-desinformacao-politica:latest
    restart: unless-stopped
    working_dir: /app/coletor
    entrypoint: ["dotnet", "AssistenteDesinformacao.Coletor.dll"]
    env_file: .env
    environment:
      ConnectionStrings__Postgres: Host=db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  dados:
  evolution_instancias:
